name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Verify local security patches
        run: node --test tests/*-safety.test.mjs
      - run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
      - working-directory: services/control-plane
        run: uv export --locked --extra dev --no-emit-project --format requirements-txt --no-hashes --output-file requirements-audit.txt
      - working-directory: services/control-plane
        run: uvx --from pip-audit pip-audit --requirement requirements-audit.txt

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/fetcher
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit locked Rust dependencies
        run: cargo audit --file Cargo.lock
