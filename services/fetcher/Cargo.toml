[package]
name = "skein-fetcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[lib]
name = "skein_fetcher"
path = "src/lib.rs"

[[bin]]
name = "skein-fetcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
